<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene harness</title>
    <!-- Dev harness for src/scene, served by the vite dev server at /scene.html. Not part of the production
         build (vite builds index.html only). Query: ?t=0.4 draws a still frame at that progress; ?reduced draws
         the reduced-motion still; ?smooth=0 turns off the eased catch-up. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b0d10;
        color: #e8e4da;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .labels p {
        position: absolute;
        left: 16px;
        bottom: 16px;
        max-width: 34rem;
        margin: 0;
        opacity: 0;
        transition: opacity 320ms;
        letter-spacing: 0.02em;
      }
      .labels p.on {
        opacity: 1;
      }
      .labels b {
        color: #e6b450;
        font-weight: 500;
      }
      .hud {
        position: absolute;
        right: 16px;
        top: 12px;
        color: #8e949c;
        font-size: 12px;
      }
      .fail {
        position: absolute;
        inset: auto 16px 50% 16px;
        color: #e6b450;
      }
    </style>
  </head>
  <body>
    <div class="scene-track" id="track">
      <div class="scene-sticky">
        <canvas class="scene-canvas" aria-hidden="true"></canvas>
        <div class="labels" id="labels"></div>
        <div class="hud" id="hud"></div>
      </div>
    </div>
    <script type="module" src="./src/scene/harness.ts"></script>
  </body>
</html>
