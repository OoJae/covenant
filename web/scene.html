<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage harness</title>
    <link rel="icon" href="data:," />
    <!-- Dev harness for src/scene (DieStage), served by the vite dev server at /scene.html. Not part of the
         production build (vite builds index.html only). Query: ?flat shows the Canvas 2D fallback; ?t=0.4 draws the
         bare scene's still frame at that progress, ?t=still the composed still; ?nodegrade turns off the
         auto-degrade (for frame timing). The chapter styles below stand in for the landing's own. -->
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: clip;
      }
      body {
        margin: 0;
        font: var(--step-body) / var(--lh-body) var(--font-sans);
      }
      .hx {
        padding-inline: var(--grid-margin);
        max-width: 44rem;
      }
      .hx p {
        margin: 0 0 var(--sp-4);
        max-width: 36rem;
        overflow-wrap: anywhere;
      }
      .hx-label {
        font: var(--step-label) / var(--lh-label) var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .hx-h1 {
        font: var(--wght-display) var(--step-hero) / var(--lh-hero) var(--font-display);
        letter-spacing: var(--track-hero);
        margin: 0 0 var(--sp-6);
        max-width: 12ch;
      }
      .hx-h1 em {
        font-weight: var(--wght-display-strong);
      }
      .hx-h2 {
        font: var(--wght-display) var(--step-chapter) / var(--lh-display) var(--font-display);
        letter-spacing: var(--track-display);
        margin: 0 0 var(--sp-4);
      }
      .hx-lede {
        font-size: var(--step-lede);
        line-height: var(--lh-lede);
        color: var(--fg-2);
      }
      .hx-after {
        min-height: 100vh;
        padding: var(--sp-section) var(--grid-margin);
      }
    </style>
  </head>
  <body class="silicon">
    <div id="stage"></div>
    <script type="module" src="./src/scene/harness.tsx"></script>
  </body>
</html>
