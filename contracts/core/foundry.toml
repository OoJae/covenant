[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"          # X Layer has no Osaka opcodes (no CLZ)
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# gas sweeps and real-netlist tests run thousands of multi-million-gas settles in one test
gas_limit = "18446744073709551615"
memory_limit = 1073741824
# golden vectors live outside this package; read-only access
fs_permissions = [
  { access = "read", path = "../../chips/golden" },
  { access = "read", path = "../../chips/out" },
  { access = "read", path = "./test/fixtures" },
]
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # test tree only: the real SealedVM and Fab (contracts/evaluator) and TapeOut's verified MIT sources
  # (contracts/vendor) are compiled into integration and fork tests. They are read from there, never edited.
  "evaluator/=../evaluator/src/",
  "tapeout/=../vendor/tapeout-xlayer/src/",
]
allow_paths = ["../evaluator", "../vendor"]
# TapeOut's NetlistVM does not compile on the legacy pipeline ("stack too deep"), so the one test harness that
# wraps the vendored sources is built with via-IR. Everything under src/ is pinned to the legacy pipeline,
# and tests deploy the harness from its artifact (deployCode) instead of importing it.
additional_compiler_profiles = [{ name = "tapeout", via_ir = true }]
compilation_restrictions = [
  { paths = "src/**", via_ir = false },
  { paths = "test/integration/TapeHarness.sol", via_ir = true },
]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 100
fail_on_revert = false

[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 256
depth = 300
fail_on_revert = false

[lint]
lint_on_build = false

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech" # tests read XLAYER_RPC_URL themselves; Foundry has no ${VAR:-default}
xlayer_fallback = "https://xlayerrpc.okx.com"

[fmt]
line_length = 120

# `FOUNDRY_PROFILE=coverage forge coverage --ir-minimum ...`: coverage needs one pipeline for every file, so
# this profile drops the per-file restrictions. It is never used to build anything that is deployed.
[profile.coverage]
additional_compiler_profiles = []
compilation_restrictions = []
