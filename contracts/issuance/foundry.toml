[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]

# Compiler: pinned. X Layer runs Cancun opcodes (TSTORE/TLOAD/MCOPY verified by eth_call, see NOTES.md).
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # test tree only: needed to compile TapeOut's vendored sources as a local fixture and oracle
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "tapeout/=../vendor/tapeout-xlayer/src/",
]
# TapeOut's verified MIT sources live outside this project root (read-only, never edited from here).
allow_paths = ["../vendor"]
# One review test forces OKB into a contract with SELFDESTRUCT, on purpose. solc warns about the opcode
# wherever it is used; nothing under src/ or script/ uses it.
ignored_warnings_from = ["test/review/SplitterAttack.t.sol"]

# Every top-level call made by a test is executed as its own transaction: intrinsic gas is charged,
# EIP-3529 refunds are settled and transient storage is cleared between calls. The KeeperTank's
# refund bound is a statement about whole transactions, so it is tested that way.
isolate = true

# Tests deploy contracts with plain `new`, compiled together with the test, instead of having forge rewrite
# those expressions into cheatcode deployments. A deployment made by a test is then a real creation
# transaction (its gas includes the initcode calldata), and the bytecode under test is unambiguous.
dynamic_test_linking = false

fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 100
# The handler is written never to revert, so a revert (including a failed assertion inside the handler)
# is a failure of the campaign.
fail_on_revert = true

[fmt]
line_length = 120
